---
- name: PLAY DE ROLLBACK - VOLVER LA RED A CERO
  hosts: cisco
  gather_facts: false
  tasks:
    - name: TASK 1 - BORRAR OSPF
      cisco.ios.ios_config:
        lines:
          - no router ospf 1
      ignore_errors: true

    - name: TASK 2 - Eliminar VLANs
      cisco.ios.ios_config:
        lines:
          - no vlan 10
          - no vlan 20
          - no vlan 30
          - no vlan 40
          - no vlan 50
          - no vlan 60
          - no vlan 100
          - no vlan 200
          - no vlan 300
      ignore_errors: true
    - name: TASK 3 - Borrar interfaces SVIs
      cisco.ios.ios_config:
        lines:
          - no interface vlan 10
          - no interface vlan 20
          - no interface vlan 30
      ignore_errors: true
