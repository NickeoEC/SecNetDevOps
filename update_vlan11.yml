---
- name: PLAY - ACTUALIZACION DE VLAN 10 (GERENCIA) A 11 (PRESIDENCIA)
  hosts: core, acceso
  gather_facts: false
  tasks:
    - name: TASK 1 - Eliminar VLAN 10 antigua
      cisco.ios.ios_config:
        lines:
          - no vlan 10
          - no interface vlan 10
    - name: TASK 2 - Crear nueva VLAN 11 PRESIDENCIA
      cisco.ios.ios_vlans:
        config:
          - vlan_id: 11
            name: PRESIDENCIA

    - name: TASK 3 - Asignar SVI a la nueva VLAN 11 (Solo en el CORE)
      cisco.ios.ios_config:
        lines:
          - ip address 10.10.11.1 255.255.255.0
          - no shutdown
        parents: interface vlan 11
      when: "'core' in group_names"
